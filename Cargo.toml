[package]
name = "rust-template-generated-bin"
version = "0.3.6-alpha.0"
edition = "2024"
rust-version = "1.94.0"
description = "Example project generated by gifnksm/rust-tmeplate"
repository = "https://github.com/gifnksm/rust-template-generated-bin"
license = "MIT OR Apache-2.0"
keywords = []
categories = []

[package.metadata.cargo-sync-rdme.badge]
style = "flat-square"
badges = {
  maintenance = true,
  license = { link = "#license" },
  crates-io = true,
  rust-version = true,
  github-actions = { workflows = "ci.yml" },
  codecov = true,
}

[package.metadata.cargo-sync-rdme.rustdoc]
toolchain = "nightly"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-fmt = "zip"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_complete_nushell = "4.6.2"
clap_mangen = "0.3.3"

[badges]
maintenance = { status = "passively-maintained" }

[profile.dev]
# for faster development iterations
debug = "line-tables-only"

[profile.release]
strip = true
